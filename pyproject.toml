[project]
name = "orchestra-py"
version = "0.1.0"
description = "A CLI multi-agent orchestrator that decomposes plain-language business requests into subtasks, routes them to role-specialised agents, and streams live progress."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.34",
    "pandas>=3.0",          # tabular analysis for the analytics agent
    "plotly>=6.9",          # chart generation for the visualization agent
]

[project.scripts]
orchestra = "orchestra.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pylint>=3.2",          # used only for the duplicate-code gate (R0801)
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra"]


# ---------------------------------------------------------------------------
# ruff — lint + format + import sorting. See CONVENTIONS.md §14.2.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff formats Python blocks inside Markdown. Documentation snippets are
# deliberately elided pseudo-code, and the pre-commit hook only passes
# python/pyi files — excluding docs keeps `ruff format .` and the hook in
# agreement instead of silently disagreeing.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes — includes F401/F841 dead code
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify — surfaces duplicated branches
    "T20",       # no print()          -> CONVENTIONS.md §5
    "TID",       # banned imports      -> CONVENTIONS.md §3.2
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "ERA",       # commented-out code
    "ASYNC",     # async footguns
    "ANN",       # missing annotations
    "RUF",
]
ignore = [
    "E501",      # line length is the formatter's job
    "ANN401",    # `Any` is banned in core/ by mypy strict, permitted at SDK adapters
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, skip annotations, and take unused fixture args.
"tests/**" = ["ANN", "ARG", "S101"]
# The one module allowed to construct Console objects — CONVENTIONS.md §5.
"src/orchestra/cli/console.py" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "google"


# ---------------------------------------------------------------------------
# mypy — strict everywhere, relaxed only at provider adapters.
# See CONVENTIONS.md §7 and §14.2.
# ---------------------------------------------------------------------------
[tool.mypy]
# Matches `.python-version` and CONVENTIONS.md line 3. At 3.11 mypy rejects the
# PEP 695 `type` statements in numpy's stubs, which pandas and pytest both pull in.
python_version = "3.12"
strict = true
files = ["src/orchestra", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

# Adapters wrap loosely-typed vendor SDKs. The relaxation is scoped by module
# path so it cannot spread inward past providers/.
[[tool.mypy.overrides]]
module = "orchestra.providers.*"
disallow_any_explicit = false
warn_return_any = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]


# ---------------------------------------------------------------------------
# pylint — used ONLY as the copy-paste detector. See CONVENTIONS.md §14.4.
# ---------------------------------------------------------------------------
[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint."similarities"]
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
